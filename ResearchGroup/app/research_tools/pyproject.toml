[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research_tools"
version = "0.1.0"
description = "FastMCP server exposing Brave Search and arXiv search tools for AgentCore"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp >= 1.28.1, < 2.0.0",
    "httpx >= 0.27.0",
    "feedparser >= 6.0.11",
    "bedrock-agentcore >= 1.18.1",
    "boto3 >= 1.35.0",
]

[dependency-groups]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.24",
    "respx >= 0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
